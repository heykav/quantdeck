name: scheduled check

# Read-only weekly health check. It installs the latest releases of the
# (unpinned) runtime and dev dependencies and runs the same lint, type and
# test steps as CI, so an upstream release that breaks quantdeck shows up as
# a failed run instead of going unnoticed between pushes.
#
# It never writes: no commits, branches, PRs or comments, no secrets, and the
# token is read-only. Fixes are made by a person in a normal PR.

on:
  schedule:
    - cron: "37 4 * * 1" # Mondays 04:37 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install latest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --upgrade-strategy eager -e ".[dev]"
          pip list

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check src tests examples scripts

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -rw
